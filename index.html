<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Álbum Panini Mundial</title>

  <!-- React CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      background: #8e0000;
      color: white;
      padding: 20px;
      margin: 0;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .card {
      width: 150px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.2s;
      padding: 10px;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      border-radius: 8px;
    }

    .detail img {
      width: 250px;
      border-radius: 10px;
      margin: 20px 0;
    }

    button {
      padding: 10px 20px;
      background: #8e0000;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #c62828;
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">

const jugadores = [
  {
    id: 1,
    nombre: "Lionel Messi",
    pais: "Argentina",
    edad: 36,
    posicion: "Delantero",
    imagen: "https://iphonegr.reforma.com/libre/online07/imagetransformer2/ImageTransformer.aspx?img=https://img.gruporeforma.com/imagenes/960x640/6/503/5502928.jpg&imagencompleta=1"
  },
  {
    id: 2,
    nombre: "Cristiano Ronaldo",
    pais: "Portugal",
    edad: 39,
    posicion: "Delantero",
    imagen: "https://i.pinimg.com/originals/c5/2d/63/c52d63b91c58d9d34653fac34dbc41bc.jpg"
  },
  {
    id: 3,
    nombre: "Kylian Mbappé",
    pais: "Francia",
    edad: 25,
    posicion: "Delantero",
    imagen: "https://icdn.football-espana.net/wp-content/uploads/2023/06/Kylian-Mbappe-PSG-042922-169.jpg"
  }
    {
    id: 4,
    nombre: "Neymar Jr",
    pais: "Brasil",
    edad: 32,
    posicion: "Delantero",
    imagen: "https://images.ctfassets.net/3mv54pzvptwz/55YLwKPDnRXkqMBITRpWbC/0c2aefc04afa455c20e9ca0d209698e0/53174188191_42d4c831ae_o.jpg"
  },
  {
    id: 5,
    nombre: "Luka Modric",
    pais: "Croacia",
    edad: 38,
    posicion: "Mediocampista",
    imagen: "https://a-static.besthdwallpaper.com/luka-modric-real-madrid-s-croatian-national-football-player-poses-wallpaper-1440x1080-98066_22.jpg"
  },
  {
    id: 6,
    nombre: "Kevin De Bruyne",
    pais: "Bélgica",
    edad: 33,
    posicion: "Mediocampista",
    imagen: "https://www.kickfootball.fr/wp-content/uploads/2023/01/Kevin-de-Bruyne.jpeg"
  },
  {
    id: 7,
    nombre: "Erling Haaland",
    pais: "Noruega",
    edad: 24,
    posicion: "Delantero",
    imagen: "https://th.bing.com/th/id/R.544246433c6c05171c9e1e4b2cb30fce?rik=1FiXy0EIzXAYtQ&pid=ImgRaw&r=0"
  },
  {
    id: 8,
    nombre: "Vinicius Jr",
    pais: "Brasil",
    edad: 24,
    posicion: "Extremo",
    imagen: "https://icdn.football-espana.net/wp-content/uploads/2025/02/Vinicius.jpg"
  },
  {
    id: 9,
    nombre: "Jude Bellingham",
    pais: "Inglaterra",
    edad: 21,
    posicion: "Mediocampista",
    imagen: "https://library.sportingnews.com/styles/twitter_card_120x120/s3/2025-03/jude%20bellingham%20real%20madrid.jpg?itok=WMjTFAJ9"
  },
  {
    id: 10,
    nombre: "Harry Kane",
    pais: "Inglaterra",
    edad: 30,
    posicion: "Delantero",
    imagen: "https://images.alphacoders.com/930/thumb-1920-930157.jpg"
  }
];

function App() {
  const [seleccionado, setSeleccionado] = React.useState(null);

  // Vista detalle
  if (seleccionado) {
    return (
      <div className="detail">
        <h1>{seleccionado.nombre}</h1>
        <img src={seleccionado.imagen} />
        <p><strong>País:</strong> {seleccionado.pais}</p>
        <p><strong>Edad:</strong> {seleccionado.edad}</p>
        <p><strong>Posición:</strong> {seleccionado.posicion}</p>
        <button onClick={() => setSeleccionado(null)}>
          Volver al álbum
        </button>
      </div>
    );
  }

  // Vista principal (galería)
  return (
    <div>
      <h1>Álbum Panini - Mundial</h1>
      <div className="gallery">
        {jugadores.map(j => (
          <div 
            key={j.id}
            className="card"
            onClick={() => setSeleccionado(j)}
          >
            <img src={j.imagen} />
            <h3>{j.nombre}</h3>
            <p>{j.pais}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
